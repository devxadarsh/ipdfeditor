<textarea
  #area
  class="native-text-edit__area"
  spellcheck="false"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="off"
  wrap="off"
  [style]="areaStyle()"
  [attr.aria-label]="'Edit PDF text'"
  [disabled]="busy()"
  (input)="onInput($event)"
  (keydown)="onKeydown($event)"
  (blur)="onBlur()"
></textarea>
